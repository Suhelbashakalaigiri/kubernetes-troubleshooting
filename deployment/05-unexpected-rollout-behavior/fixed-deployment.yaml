apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-unexpected-rollout
  labels:
    app: unexpected-rollout-demo
    troubleshooting: deployment
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: unexpected-rollout-demo
  template:
    metadata:
      labels:
        app: unexpected-rollout-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
