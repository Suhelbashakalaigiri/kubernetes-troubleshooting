apiVersion: v1
kind: Pod
metadata:
  name: pod-crashloopbackoff
  labels:
    app: crashloopbackoff-demo
    troubleshooting: pod
spec:
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Starting worker service...'; echo 'Configuration loaded successfully'; while true; do echo 'Worker heartbeat'; sleep 30; done"]
