
apiVersion: v1
kind: Pod
metadata:
  name: pod-failed-mount
  labels:
    app: failed-mount-demo
    troubleshooting: pod
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      volumeMounts:
        - name: config-volume
          mountPath: /var/config
  volumes:
    - name: config-volume
      emptyDir: {}
