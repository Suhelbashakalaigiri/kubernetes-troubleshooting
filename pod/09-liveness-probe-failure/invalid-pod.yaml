apiVersion: v1
kind: Pod
metadata:
  name: pod-liveness-probe-failure
  labels:
    app: liveness-failure-demo
    troubleshooting: pod
spec:
  containers:
  - name: web
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 3
      failureThreshold: 2
