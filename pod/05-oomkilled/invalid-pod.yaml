apiVersion: v1
kind: Pod
metadata:
  name: pod-oomkilled
  labels:
    app: oomkilled-demo
    troubleshooting: pod
spec:
  restartPolicy: Never
  containers:
  - name: memory-consumer
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Allocating memory beyond cgroup limit...'; head -c 50M /dev/zero > /dev/shm/overflow.bin; echo 'Done'; sleep 3600"]
    resources:
      limits:
        memory: "20Mi"
      requests:
        memory: "10Mi"
