
apiVersion: v1
kind: Pod
metadata:
  name: pod-oomkilled
  labels:
    app: oomkilled-demo
    troubleshooting: pod
spec:
  restartPolicy: Never
  containers:
    - name: memory-consumer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Allocating memory beyond container limit..."
          MEMORY=$(head -c 50000000 /dev/zero | tr '\000' 'A')
          echo "Allocation completed"
          sleep 3600
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"
