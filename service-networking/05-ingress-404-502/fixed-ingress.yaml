apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-ingress-backend
  labels:
    app: ingress-backend
    troubleshooting: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-backend
  template:
    metadata:
      labels:
        app: ingress-backend
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-ingress-backend
  labels:
    troubleshooting: networking
spec:
  type: ClusterIP
  selector:
    app: ingress-backend
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  labels:
    troubleshooting: networking
spec:
  rules:
  - host: demo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc-ingress-backend
            port:
              number: 80
