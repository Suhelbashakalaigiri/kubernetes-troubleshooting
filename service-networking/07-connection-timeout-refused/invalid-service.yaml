apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-timeout-refused
  labels:
    app: timeout-refused-demo
    troubleshooting: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timeout-refused-demo
  template:
    metadata:
      labels:
        app: timeout-refused-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-timeout-refused
  labels:
    troubleshooting: networking
spec:
  type: ClusterIP
  selector:
    app: timeout-refused-demo
  ports:
  - name: http
    port: 80
    targetPort: 9999
