apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-nodeport
  labels:
    app: nodeport-demo
    troubleshooting: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodeport-demo
  template:
    metadata:
      labels:
        app: nodeport-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  labels:
    troubleshooting: networking
spec:
  type: NodePort
  selector:
    app: nodeport-demo
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
