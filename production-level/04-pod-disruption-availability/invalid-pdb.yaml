apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-pdb-blocked
  labels:
    app: pdb-demo
    troubleshooting: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdb-demo
  template:
    metadata:
      labels:
        app: pdb-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-strict-block
  labels:
    troubleshooting: production
spec:
  minAvailable: 100%
  selector:
    matchLabels:
      app: pdb-demo
