apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-warmup-outage
  labels:
    app: warmup-demo
    troubleshooting: production
spec:
  replicas: 2
  minReadySeconds: 3
  selector:
    matchLabels:
      app: warmup-demo
  template:
    metadata:
      labels:
        app: warmup-demo
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Bootstrapping server (warming up caches)..."
          sleep 8
          echo "Server online on port 80."
          httpd -f -p 80
        # Best Practice: Readiness probe prevents routing traffic to warming up container
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 5
