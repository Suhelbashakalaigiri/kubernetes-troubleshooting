apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-anti-affinity
  labels:
    app: anti-affinity-demo
    troubleshooting: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anti-affinity-demo
  template:
    metadata:
      labels:
        app: anti-affinity-demo
    spec:
      # Flawed: Hard anti-affinity requires that no two replicas run on the same hostname in a 1-node cluster!
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - anti-affinity-demo
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
