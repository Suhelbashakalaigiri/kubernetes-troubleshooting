apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-hpa-target
  labels:
    app: hpa-target-demo
    troubleshooting: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-target-demo
  template:
    metadata:
      labels:
        app: hpa-target-demo
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-target-demo
  labels:
    troubleshooting: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-hpa-target
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
