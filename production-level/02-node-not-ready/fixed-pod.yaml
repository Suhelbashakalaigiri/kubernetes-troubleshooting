apiVersion: v1
kind: Pod
metadata:
  name: pod-critical-workload
  labels:
    app: critical-node-workload
    troubleshooting: production
spec:
  # Best Practice: Explicit tolerations allow critical workloads to tolerate transient node not-ready states
  tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 600
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 600
  containers:
  - name: app
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
