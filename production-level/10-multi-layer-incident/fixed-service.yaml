apiVersion: v1
kind: Service
metadata:
  name: svc-multi-layer
  labels:
    troubleshooting: production
spec:
  type: ClusterIP
  # Layer 2 fix: Selector matches Pod labels
  selector:
    app: incident-backend
  # Layer 3 fix: targetPort aligns with container port 80
  ports:
  - name: http
    port: 80
    targetPort: 80
