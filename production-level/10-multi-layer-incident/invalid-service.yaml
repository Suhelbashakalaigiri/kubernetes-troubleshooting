apiVersion: v1
kind: Service
metadata:
  name: svc-multi-layer
  labels:
    troubleshooting: production
spec:
  type: ClusterIP
  # Layer 2 failure: Mismatched selector! Looks for app: incident-wrong-selector
  selector:
    app: incident-wrong-selector
  # Layer 3 failure: Wrong targetPort! Forwards to 8080 instead of 80
  ports:
  - name: http
    port: 80
    targetPort: 8080
