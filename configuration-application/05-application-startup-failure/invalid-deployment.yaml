apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-startup-failure
  labels:
    app: startup-failure-demo
    troubleshooting: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: startup-failure-demo
  template:
    metadata:
      labels:
        app: startup-failure-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Initializing application..."
          if [ -z "$REQUIRED_STORAGE_PATH" ]; then
            echo "FATAL: REQUIRED_STORAGE_PATH environment variable is missing!" >&2
            exit 1
          fi
          echo "Starting service on $REQUIRED_STORAGE_PATH..."
          sleep 3600
