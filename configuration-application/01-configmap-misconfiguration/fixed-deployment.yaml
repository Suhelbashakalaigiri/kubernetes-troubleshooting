apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-configmap-error
  labels:
    app: configmap-demo
    troubleshooting: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo Database host is $DB_HOST; sleep 3600"]
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
