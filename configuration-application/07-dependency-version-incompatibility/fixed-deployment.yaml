apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-version-incompatibility
  labels:
    app: version-demo
    troubleshooting: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: version-demo
  template:
    metadata:
      labels:
        app: version-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        # Corrected: Uses flags natively supported by busybox httpd
        command: ["httpd", "-f", "-p", "8080"]
