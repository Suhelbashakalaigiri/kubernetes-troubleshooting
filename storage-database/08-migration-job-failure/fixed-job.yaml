apiVersion: batch/v1
kind: Job
metadata:
  name: job-db-migration
  labels:
    troubleshooting: storage
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrator
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Executing database migration V1.2.0..."
          echo "CREATE TABLE IF NOT EXISTS user_profiles (id INT PRIMARY KEY);"
          echo "Database migration completed successfully."
          exit 0
