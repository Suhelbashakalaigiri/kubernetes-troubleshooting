apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-mysql-ephemeral
  labels:
    app: mysql-ephemeral-demo
    troubleshooting: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-ephemeral-demo
  template:
    metadata:
      labels:
        app: mysql-ephemeral-demo
    spec:
      containers:
      - name: mysql
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Simulated database running with PersistentVolume..."
          echo "Records stored in /var/lib/mysql: $(cat /var/lib/mysql/data.txt 2>/dev/null || echo 'NONE (FIRST BOOT)')"
          sleep 3600
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc-demo
