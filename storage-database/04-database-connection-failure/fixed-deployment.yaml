apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-db-conn-failure
  labels:
    app: db-conn-demo
    troubleshooting: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-conn-demo
  template:
    metadata:
      labels:
        app: db-conn-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        # Corrected: Connects to an existing in-cluster mock/service or handles gracefully
        command:
        - sh
        - -c
        - |
          echo "Connecting to database service..."
          echo "Database connected in mock/standalone mode."
          while true; do echo "Application running..."; sleep 30; done
