apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-db-not-ready
  labels:
    app: db-not-ready-demo
    troubleshooting: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-not-ready-demo
  template:
    metadata:
      labels:
        app: db-not-ready-demo
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Starting application..."
          echo "Querying database..."
          # Application fails immediately if database readiness marker is absent
          if [ ! -f /tmp/db-ready-flag ]; then
            echo "FATAL: Database is not ready to accept connections!" >&2
            exit 1
          fi
          echo "Application running."
          sleep 3600
